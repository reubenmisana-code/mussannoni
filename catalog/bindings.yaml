# Reports whose pages carry several blocks of rows, each repeating the label band, rather than one
# continuous table. Declared, not detected: every content-based attempt to tell a band from a body has
# misclassified some page (docs/06-exametrics-alignment.md section 6). Measured 2026-09-23 — each of
# these prints 6 blocks of 10 rows (one per subject) across 3 pages, 60 data rows total, with blocks
# spanning page boundaries and label rows at [3,17] / [2,8,22] / [2,6,20] or [5,21] per page.
multi_block:
- primary/council_top_schools_kimasomo_overall
- primary/council_top_schools_kimasomo_serikali
- primary/region_shule_bora_masomo_serikali
- primary/region_shule_bora_masomo_jumla
# The column count of a report's own table, where the majority-of-pages rule picks the wrong grid.
# region_ufaulu_masomo is one page of 28-column subject rows followed by two pages of 20-column
# compound summaries, so the majority grid is the sections' and the distilled layout described a table
# the rows do not belong to (header.labels came out as 20 empty strings). Counting rows instead of
# pages does not separate them either — measured 2026-09-23, the two summary pages carry 13 rows
# spanning their full 20-column grid against page 1's 7. No count works, so it is declared.
table_grid:
  primary/region_ufaulu_masomo: 28
unresolved:
  primary/council_kata_rank_alama: no repeating table on this sample. Page 1 is entirely nested mini-tables;
    page 2 carries a real 29-column label row (S/N | KATA | IDADI YA SHULE | WAV | WAS | JML) but only the
    JUMLA totals row beneath it, so there are no ward data rows to bind. layout.header.labels is itself a
    DATA row ('01','HISABATI','0','0.0',...,'DARAJA C (VIZURI)'), which is the real cause of the recorded
    29-vs-30 mismatch. Belongs to the roles/bands contract, not to column identity.
  primary/council_subject_summary: no repeating table. A one-page 19-column compound summary whose content
    is aggregates split by sex (WAV/WAS/JML) inside several mini-tables. Belongs to the roles/bands contract.
  primary/council_ufaulu_wa_masomo: no repeating table. A one-page 28-column compound summary of the same
    shape as council_subject_summary. Belongs to the roles/bands contract.
