# Column identity per report. See `provenance`.
# Regenerate deliberately, not automatically: these names are a contract with the
# application that supplies the rows.
schema_version: 1
provenance: Column field names for each report's measured grid, aligned index-for-index with layout.json
  header.labels. The names are the ExaMetrics registry's own, moved here from backend-sis app/services/exametrics/mussannoni/bindings.py
  so that column identity lives beside the measurement that established the columns rather than being
  retyped by every consumer. An empty string is a measured column the reference draws blank; it is addressable
  but carries no field. Nothing here is inferred from the reference's text.
alignment_rule: len(fields) == len(layout.header.labels) for every entry. Where the registry omitted a
  trailing or leading unlabelled column that has no body prototype, an empty string was inserted at that
  measured index; that is the only adjustment applied, and it is recorded per report in `padded`.
