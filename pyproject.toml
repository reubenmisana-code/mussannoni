[project]
name = "mussannoni"
version = "0.1.0"
description = "Measured SARS PDF-to-HTML conversion workshop"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "lxml==6.1.3",
    "pillow==12.3.0",
    "pymupdf==1.28.2",
    "pyyaml==6.0.3",
    "scikit-image==0.26.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
