[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mussannoni"
version = "0.1.1"
description = "Render Tanzanian school examination result reports to pixel-measured PDFs from plain Python dicts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "templates/_shared/fonts/LIBERATION-LICENSE.txt"]
keywords = [
    "pdf",
    "reports",
    "tanzania",
    "education",
    "necta",
    "sars",
    "weasyprint",
    "jinja2",
]
authors = [
    { name = "Reuben Misana" },
    { name = "Kiyabo Nhende", email = "kiyaboapp@gmail.com" },
]
maintainers = [
    { name = "Kiyabo Nhende", email = "kiyaboapp@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

# The runtime needs only a templating engine, a renderer and a PDF writer. Everything the
# fidelity workshop uses (HTTP scraping, raster diffing, SSIM) lives in the `workshop` extra so
# an application install stays small.
dependencies = [
    "jinja2==3.1.6",
    "pymupdf==1.28.2",
    "weasyprint>=70.0",
]

[project.optional-dependencies]
# The measurement workshop: fetching reference PDFs, extracting evidence, rastering and
# comparing. Not needed to render a report.
workshop = [
    "httpx==0.28.1",
    "lxml==6.1.3",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "scikit-image==0.26.0",
]

[project.scripts]
mussannoni = "mussannoni.cli:main"

[project.urls]
Homepage = "https://github.com/reubenmisana-code/mussannoni"
Repository = "https://github.com/reubenmisana-code/mussannoni"
Issues = "https://github.com/reubenmisana-code/mussannoni/issues"

[dependency-groups]
dev = [
    "mussannoni[workshop]",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mussannoni"]

# The sdist carries the package, the workshop sources and the docs — but none of the measurement
# artifacts, which live in git and are regenerated from a checkout:
#
#   corpus/    reference PDFs downloaded from sars.ac.tz; not ours to redistribute
#   extract/   76 MB of measurement evidence, read only by tools/scaffold.py
#   output/    renders, regenerated by `make convert`
#   templates/ the workshop's working copy. Excluded because src/mussannoni/resources/ already
#              carries every shipped byte of it, so including both duplicated ~24 MB of identical
#              font files — and it could not regenerate those resources anyway, since doing that
#              needs the 257 MB of fixture.json that an sdist must not carry.
#
# The one exception is a single sample pair: the reference PDF for `school_results` and the render
# made from it, so the fidelity claim is demonstrable from the distribution alone. Its provenance
# (sha256, page count, fetch timestamp) is in corpus/MANIFEST.json and its measured metrics in the
# accompanying report.json. Rendering does not read any of it; it is documentation.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tools",
    "/tests",
    "/docs",
    "/catalog",
    "/scripts",
    "/Makefile",
    "/README.md",
    "/LICENSE",
    "/CREDITS.md",
    "/CHANGELOG.md",
    "/corpus/MANIFEST.json",
    "/corpus/secondary/school-results.pdf",
    "/output/secondary/school-results/rendered.pdf",
    "/output/secondary/school-results/report.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
